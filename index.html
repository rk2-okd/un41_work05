<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>コイン集め</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #1b2430;
            color: #1b2430;
            font-family: sans-serif;
            touch-action: none;
        }

        .page {
            height: 100%;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        .hud, .controls {
            background: #f7f4ee;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
        }

        #score {
            font-size: 28px;
            font-weight: 700;
            min-width: 2ch;
            text-align: right;
        }

        #stage {
            flex: 1;
            min-height: 0;
            position: relative;
            background: #87b8e0;
            touch-action: none;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            background: #87b8e0;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            pointer-events: none;
        }

        button {
            min-height: 48px;
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: #e0a106;
            color: #1b2430;
            font-size: 16px;
            font-weight: 700;
        }

        .credit {
            font-size: 11px;
            color: #5c6570;
        }

        #qrcode {
            width: 96px;
            height: 96px;
            background: white;
            flex: none;
        }

        #qrcode img, #qrcode canvas {
            width: 96px;
            height: 96px;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="hud">
            <h1>コイン集め</h1>
            <div>取得枚数 <span id="score">0</span></div>
        </header>
        <div id="stage">
            <canvas id="unity-canvas"></canvas>
            <div id="loading">読み込み中</div>
        </div>
        <footer class="controls">
            <button id="respawn" type="button">コインを再配置</button>
            <div id="qrcode" title="このページのQRコード"></div>
            <p class="credit">画面中央から指をずらすと移動します<br>ユニティちゃん © ユニティ・テクノロジーズ・ジャパン／UCL</p>
        </footer>
    </div>

    <script src="Build/WebGL.loader.js"></script>
    <script src="qrcode.min.js"></script>
    <script>
        var unityInstance = null;
        var canvas = document.querySelector("#unity-canvas");
        var scoreEl = document.querySelector("#score");

        window.onUnityScore = function (message) {
            scoreEl.textContent = message;
        };

        function fitCanvas() {
            var stage = document.querySelector("#stage");
            var rect = stage.getBoundingClientRect();
            var ratio = window.devicePixelRatio || 1;
            canvas.width = Math.max(2, Math.floor(rect.width * ratio));
            canvas.height = Math.max(2, Math.floor(rect.height * ratio));
        }

        fitCanvas();

        function sendMove(clientX, clientY) {
            if (!unityInstance) {
                return;
            }

            var rect = canvas.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;
            var dx = clientX - centerX;
            var dy = clientY - centerY;
            var length = Math.hypot(dx, dy);
            if (length < 24) {
                unityInstance.SendMessage("Player", "SetMove", "0,0");
                return;
            }

            dx /= length;
            dy /= length;
            var packed = dx.toFixed(3) + "," + (-dy).toFixed(3);
            unityInstance.SendMessage("Player", "SetMove", packed);
        }

        function stopMove() {
            if (!unityInstance) {
                return;
            }
            unityInstance.SendMessage("Player", "SetMove", "0,0");
        }

        canvas.addEventListener("touchstart", function (e) {
            e.preventDefault();
            sendMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener("touchmove", function (e) {
            e.preventDefault();
            sendMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        canvas.addEventListener("touchend", function (e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                sendMove(e.touches[0].clientX, e.touches[0].clientY);
                return;
            }
            stopMove();
        }, { passive: false });

        canvas.addEventListener("touchcancel", function (e) {
            e.preventDefault();
            stopMove();
        }, { passive: false });

        canvas.addEventListener("mousedown", function (e) {
            sendMove(e.clientX, e.clientY);
        });

        window.addEventListener("mousemove", function (e) {
            if ((e.buttons & 1) === 0) {
                return;
            }
            sendMove(e.clientX, e.clientY);
        });

        window.addEventListener("mouseup", function () {
            stopMove();
        });

        document.querySelector("#respawn").addEventListener("click", function () {
            if (!unityInstance) {
                return;
            }
            unityInstance.SendMessage("CoinSpawner", "Respawn", "respawn");
        });

        createUnityInstance(canvas, {
            dataUrl: "Build/WebGL.data",
            frameworkUrl: "Build/WebGL.framework.js",
            codeUrl: "Build/WebGL.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Sakura",
            productName: "CoinCollect",
            productVersion: "1.0"
        }).then(function (instance) {
            unityInstance = instance;
            document.querySelector("#loading").style.display = "none";
        }).catch(function (error) {
            document.querySelector("#loading").textContent = "起動に失敗しました";
            console.log(error);
        });

        if (location.protocol !== "file:") {
            new QRCode(document.querySelector("#qrcode"), {
                text: location.href,
                width: 96,
                height: 96,
                correctLevel: QRCode.CorrectLevel.M
            });
        }
    </script>
</body>
</html>
